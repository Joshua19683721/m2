name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一時間只跑一次部署，新的 push 會取消舊的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 驗證內容
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # build_scenes.py 的簡體字關卡需要 OpenCC
      - name: 安裝檢查工具
        run: pip install --quiet opencc-python-reimplemented

      # 內容有問題（缺 ipa、句子誤帶 ipa、彎引號、簡體字、漏收官方詞表的詞）就擋下，不讓上線
      - name: 驗證場景內容與 100% 覆蓋率
        run: python tools/build_scenes.py --check

      # 改了 data/parts*/ 卻忘記重新產生詞庫時擋下（避免線上跑舊內容）
      # 比對前先把行尾正規化：不論在 Windows 或 Linux 產生，行尾都應該視為相同，
      # 不然用 Windows 編輯器碰過 scenes.js 就會整份被判成不同步。
      - name: 檢查 data/scenes.js 與來源一致
        run: |
          cp data/scenes.js /tmp/scenes.committed
          python tools/build_scenes.py
          if ! diff -q --strip-trailing-cr /tmp/scenes.committed data/scenes.js > /dev/null; then
            echo "❌ data/scenes.js 與 data/parts/ 不同步"
            echo "   請在本地執行 python tools/build_scenes.py 後，把 data/scenes.js 一起 commit"
            diff --strip-trailing-cr /tmp/scenes.committed data/scenes.js | head -40
            exit 1
          fi
          echo "✅ data/scenes.js 與來源一致"

      - name: 檢查詞庫裡沒有簡體字
        run: python tools/scan_simplified.py

      - name: 回歸測試
        run: |
          node tools/test.js
          node tools/test_apostrophe.js

      - name: 設定 Pages
        id: pages
        uses: actions/configure-pages@v5

      # 先整理成單一目錄再上傳。
      # 不要直接用多行 path：upload-pages-artifact 會把多行值原樣交給 tar，
      # 變成一個含 \n 的單一參數，tar 會回 "Cannot open: No such file or directory"。
      - name: 整理要部署的檔案
        run: |
          set -e
          rm -rf _site
          mkdir -p _site/data _site/tools
          cp index.html            _site/
          cp -r css js             _site/
          cp data/scenes.js        _site/data/
          cp tools/mobile-check.html _site/tools/
          echo "將部署："
          find _site -type f | sort

      - name: 打包
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4